name: Keep Poop Bot Alive

on:
  schedule:
    - cron: '*/10 * * * *'      # 每 10 分鐘（UTC 時區）
  workflow_dispatch:            # 可手動觸發

jobs:
  ping-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 顯示目前 UTC 時間（確認排程）
        run: date -u

      - name: 呼叫 Render /keepalive
        run: curl -s https://poop-tracker-bot.onrender.com/keepalive
